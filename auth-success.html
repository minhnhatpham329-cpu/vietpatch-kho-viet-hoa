<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Đăng nhập thành công | VietPatch</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #171613; background: #eee8dc; font-family: system-ui, sans-serif; }
        main { width: min(560px, 100%); padding: 48px; border: 1px solid #171613; border-top: 5px solid #c84635; background: #faf7f0; box-shadow: 12px 12px 0 rgba(23,22,19,.12); text-align: center; }
        span { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 24px; color: #fff; background: #2e684f; font-size: 28px; font-weight: 900; }
        h1 { margin: 0; font-size: 36px; }
        p { margin: 16px 0 0; color: #6d675d; font-size: 17px; line-height: 1.6; }
        a { display: inline-block; margin-top: 28px; color: #c84635; font-weight: 800; }
    </style>
</head>
<body>
    <main>
        <span>✓</span>
        <h1>Đăng nhập Google thành công</h1>
        <p>Phiên đăng nhập đã được xác minh. Bạn có thể quay lại thư viện và tiếp tục sử dụng tài khoản.</p>
        <a href="/">Quay lại VietPatch</a>
    </main>
</body>
</html>
