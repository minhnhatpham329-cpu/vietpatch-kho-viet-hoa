<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Đăng nhập thành công | PỏnGG</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f8f7f3; background: #07090d; font-family: system-ui, sans-serif; }
        main { width: min(560px, 100%); text-align: center; }
        span { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 50%; color: #07120b; background: #72e49c; font-size: 28px; font-weight: 900; }
        h1 { margin: 0; font-size: 36px; }
        p { margin: 16px 0 0; color: rgba(255,255,255,.66); font-size: 17px; line-height: 1.6; }
        a { display: inline-block; margin-top: 28px; color: #fff; font-weight: 800; }
    </style>
</head>
<body>
    <main>
        <span>✓</span>
        <h1>Đăng nhập Google thành công</h1>
        <p>Tài khoản thử nghiệm đã được lưu an toàn vào Supabase. Website vẫn đang ở chế độ bảo trì.</p>
        <a href="/">Quay lại trang bảo trì</a>
    </main>
</body>
</html>
