<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preload" as="image" href="/assets/images/elliot-keyart.webp" type="image/webp" fetchpriority="high">
    <title>PỏnGG | Đang hoàn thiện</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: end start;
            padding: clamp(24px, 6vw, 72px);
            overflow: hidden;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                linear-gradient(90deg, rgba(4, 6, 10, .9) 0%, rgba(4, 6, 10, .5) 48%, rgba(4, 6, 10, .12) 100%),
                linear-gradient(0deg, rgba(4, 6, 10, .88), transparent 70%),
                image-set(
                    url("/assets/images/elliot-keyart.webp") type("image/webp"),
                    url("/assets/images/elliot-keyart.png") type("image/png")
                ) 50% 20% / cover no-repeat,
                #05070b;
        }
        main { max-width: 720px; padding-bottom: 4vh; }
        .brand { margin-bottom: 28px; font-size: 14px; font-weight: 800; text-transform: uppercase; }
        h1 { max-width: 680px; font-size: clamp(40px, 8vw, 92px); line-height: .98; }
        p { max-width: 560px; margin-top: 22px; color: rgba(255,255,255,.72); font-size: clamp(16px, 2vw, 20px); line-height: 1.65; }
        .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 32px; font-size: 14px; font-weight: 700; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff4a42; box-shadow: 0 0 0 6px rgba(255,74,66,.14); }
        @media (max-width: 640px) {
            body { background-position: center, center, 40% top, center; }
            main { padding-bottom: 8vh; }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">PỏnGG Việt Hóa</div>
        <h1>Đang hoàn thiện bản phát hành.</h1>
        <p>Website tạm đóng để chuẩn bị video trải nghiệm, hệ thống tài khoản và launcher Việt hóa.</p>
        <div class="status"><span class="dot"></span> Chưa mở đăng ký và tải xuống</div>
    </main>
</body>
</html>
